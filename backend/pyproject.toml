[project]
name = "backend"
version = "0.1.0"
description = "Multi-shadow sculpture generator: grows a 3D tree whose projections match target shadows (Space Colonization Algorithm)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "pillow>=12.1.1",
    "uvicorn>=0.41.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "trimesh>=5.2.0",
    "manifold3d>=3.5.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
